<!DOCTYPE html>
<html>
<head>
    <title>List of Words</title>
</head>
<body>
    <h1>List of Words</h1>
    <ul>
        {% for word in words %}
            <li>
                <strong>{{ word.original }}</strong>: {{ word.translation }} 
                <em>({{ word.language }})</em>
            </li>
        {% empty %}
            <li>No words registered yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
